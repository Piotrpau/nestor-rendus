<script>
let DATA = JSON.parse(document.getElementById('data').textContent);
document.getElementById('maj').textContent = new Date(DATA.updated).toLocaleString('fr-FR');

const C = { node: null, parentId: null, idx: null };
const treeEl = document.getElementById('tree');
const zoomBanner = document.getElementById('zoomBanner');

function uid(n) { return n._id || (n._id = 'n' + Math.random().toString(36).slice(2, 9)); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// Render WF-style: text is raw HTML if it looks like it (time tags, marks), else escaped
function renderName(n) {
  const t = n.name || '';
  if (/<[a-z]/i.test(t)) return t; // contains HTML (time, mark, b, hr) — trust WF export
  return esc(t);
}

function render(node, parentEl) {
  node.children.forEach((child, i) => renderNode(child, parentEl, node, i));
}

function renderNode(n, parentEl, parent, idx) {
  n._parent = parent; n._idx = idx;
  const row = document.createElement('div');
  row.className = 'row' + (n.complete ? ' done' : '');
  row.dataset.id = uid(n);
  const bullet = document.createElement('span');
  bullet.className = 'bullet';
  bullet.textContent = n.children.length ? (n._open === false ? '▸' : '▾') : '•';
  const content = document.createElement('div');
  content.className = 'content';
  content.contentEditable = 'true';
  content.innerHTML = renderName(n);
  row.appendChild(bullet); row.appendChild(content);
  parentEl.appendChild(row);

  const kids = document.createElement('div');
  kids.className = 'children' + (n._open === false ? ' childrenHidden' : '');
  render(n, kids);
  parentEl.appendChild(kids);

  bullet.onclick = () => { if (!n.children.length) return; n._open = (n._open === false); kids.classList.toggle('childrenHidden'); bullet.textContent = n._open === false ? '▸' : '▾'; };
  content.addEventListener('input', () => { n.name = content.textContent; });

  // Key handling
  content.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const newText = content.textContent;
      content.textContent = newText; n.name = newText;
      const nn = { name: '', complete: false, children: [] };
      if (document.getCaretRect) {}
      parent.children.splice(idx + 1, 0, nn);
      rerender();
      setTimeout(() => focusNode(nn, 0), 30);
    } else if (e.key === 'Tab') {
      e.preventDefault();
      if (e.shiftKey) {
        // outdent: move under grandparent after parent
        const g = outdentTarget(parent);
        if (!g) return;
        const [me] = parent.children.splice(idx, 1);
        g.children.splice(parent._idx + 1, 0, me);
        rerender(); setTimeout(() => focusNode(me, me.name.length), 30);
      } else {
        if (idx === 0) return;
        const [me] = parent.children.splice(idx, 1);
        const prev = parent.children[idx - 1];
        prev._open = true;
        prev.children.push(me);
        rerender(); setTimeout(() => focusNode(me, me.name.length), 30);
      }
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      if (content.textContent.length && (e.key==='ArrowUp'? selAtStart(content): selAtEnd(content)) === false) return;
      e.preventDefault();
      navigate(parent, idx, e.key === 'ArrowUp' ? -1 : 1);
    } else if (e.key === 'Backspace' && content.textContent === '' && document.getSelection().anchorOffset === 0) {
      e.preventDefault();
      if (parent.children.length <= 1) return;
      parent.children.splice(idx, 1);
      rerender(); setTimeout(() => { const prev = siblingBefore(parent, idx); if (prev) focusNode(prev, prev.name.length); }, 30);
    }
  });
}

function outdentTarget(parent) { return parent._parent || null; }
function selAtStart(el) { const s = document.getSelection(); const r = s.getRangeAt(0); const r2 = r.cloneRange(); r2.selectNodeContents(el); r2.setEnd(r.startContainer, r.startOffset); return r2.toString().length === 0; }
function selAtEnd(el) { const s = document.getSelection(); const r = s.getRangeAt(0); const r2 = r.cloneRange(); r2.selectNodeContents(el); r2.setStart(r.endContainer, r.endOffset); return r2.toString().length === 0; }

function allNodes(n, out = [], parent = null) {
  n._parent = parent;
  n.children.forEach((c, i) => { c._idx = i; allNodes(c, out, n); });
  if (parent === null && out.length === 0) out.push(n);
  return out;
}
function navigate(parent, idx, dir) {
  const flat = [];
  collect(root, flat);
  const cur = parent.children[idx];
  const i = flat.indexOf(cur);
  const t = flat[i + dir];
  if (t) focusNode(t, dir > 0 ? 0 : t.name.length);
}
function collect(n, out) { out.push(n); n.children.forEach(c => { if (c._open !== false) collect(c, out); }); }
function siblingBefore(parent, idx) { return parent.children[idx - 1]; }
function focusNode(n, pos) {
  const el = treeEl.querySelector('.row[data-id="' + uid(n) + '"] .content');
  if (!el) return;
  el.focus();
  const r = document.createRange(); r.selectNodeContents(el);
  try { r.collapse(false); const s = document.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
}

// Export: rebuild OPML from tree, escaping to double-encoded WF format
function exportOPML() {
  function encInner(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function enc(s) { return encInner(encInner(s)); }
  let out = '<?xml version="1.0"?>\n<opml version="2.0">\n <head><ownerEmail>pierreduffourc@gmail.com</ownerEmail></head>\n <body>\n';
  function walk(n, depth) {
    const pad = ' '.repeat(depth + 1);
    const complete = n.complete ? ' _complete="true"' : '';
    out += pad + '<outline text="' + enc(n.name) + '"' + complete + (n.children.length ? '' : ' /') + '>' + '\n';
    n.children.forEach(c => walk(c, depth + 1));
    if (n.children.length) out += pad + '</outline>' + '\n';
  }
  walk(DATA.root, 1);
  out += ' </body>\n</opml>';
  const blob = new Blob([out], { type: 'text/x-opml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pro-export.opml';
  a.click();
}

document.getElementById('save').onclick = exportOPML;
document.getElementById('expandAll').onclick = () => { (function f(n) { n._open = true; n._id=null; n.children.forEach(f); })(DATA.root); rerender(); };
document.getElementById('collapseAll').onclick = () => { (function f(n) { n._open = false; n._id=null; n.children.forEach(f); })(DATA.root); rerender(); };

function rerender() {
  treeEl.innerHTML = '';
  (function clearIds(n){ delete n._id; delete n._parent; delete n._idx; n.children.forEach(clearIds); })(DATA.root);
  render(DATA.root, treeEl);
}

// click bullet toggles handled; dblclick text to toggle complete like WF? keep simple: ctrl+enter toggle
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter') {
    const sel = document.getSelection();
    const row = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement).closest('.row');
    if (row) { const n = findNode(row.dataset.id); n.complete = !n.complete; row.classList.toggle('done'); }
  }
  if (e.ctrlKey && e.key === 's') { e.preventDefault(); exportOPML(); }
});
let root = DATA.root;
function findNode(id) { let found = null; (function f(n){ if (n._id === id) { found = n; return; } n.children.forEach(f); })(DATA.root); return found; }

rerender();
</script>
