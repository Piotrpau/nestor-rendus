function toast(m, ms){ toastEl.textContent = m; toastEl.style.display='block'; if(ms!==0) setTimeout(()=>toastEl.style.display='none', ms||3500); }
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

const TIME_RE = /<time startYear="(\d+)" startMonth="(\d+)" startDay="(\d+)">[\s\S]*?<\/time>/g;
function shortDate(a, b, yRaw){
  a = +a; b = +b;
  let d, mo;
  if (a > 12 && b <= 12) { d = a; mo = b; }
  else if (b > 12 && a <= 12) { d = b; mo = a; }
  else { d = a; mo = b; }
  const y = String(yRaw).length === 2 ? 2000 + +yRaw : +yRaw;
  const dt = new Date(y, mo-1, d);
  const full = dt.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', year:'numeric' }).replace(',', '');
  return { d, mo, y, full };
}
const SHORT_RE = /!(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b/g;
const BADGE_RE = /\u0001([\d/]+)\u0002/g;

function display(n){
  let t = (n.n || '');
  t = t.replace(TIME_RE, (m,y,mo,d) => '\u0001' + (+d) + '/' + (+mo) + '/' + String(y).slice(2) + '\u0002');
  if (/<\/(mark|b|a|time|i)\s*>|<mark\b|<a\b|<time\b|<b\b|<i\b/i.test(t)) {
    // contenu WF riche (markdown WF de confiance) : rendre les tags + badge dates
    return t.replace(BADGE_RE, (m,d) => '<span class="badge">📅 ' + d + '</span>');
  }
  t = esc(t);
  t = t.replace(BADGE_RE, (m,d) => '<span class="badge">📅 ' + d + '</span>');
  t = t.replace(SHORT_RE, (m,a,b,y) => { const s = shortDate(a,b,y); return '<span class="badge">📅 ' + s.d + '/' + s.mo + '/' + String(s.y).slice(2) + '</span>'; });
  return t;
}
function editable(n){
  let t = (n.n || '');
  t = t.replace(TIME_RE, (m,y,mo,d) => '!' + (+d) + '/' + (+mo) + '/' + String(y).slice(2));
  return esc(t);
}
function toRaw(txt){
  return txt.replace(/\u00a0/g, ' ').replace(/\s+$/, '').replace(SHORT_RE, (m,a,b,y) => {
    const s = shortDate(a,b,y);
    return '<time startYear="' + s.y + '" startMonth="' + s.mo + '" startDay="' + s.d + '">' + s.full + '</time>';
  });
}

function renderNode(n, parentEl, parent, idx){
  n._parent = parent; n._pidx = idx;
  const row = document.createElement('div');
  row.className = 'row' + (n.c ? ' done' : '');
  row.dataset.id = nid(n);
  const bullet = document.createElement('span');
  bullet.className = 'bullet';
  bullet.textContent = n.k && n.k.length ? (n._open === false ? '▸' : '▾') : '•';
  const content = document.createElement('div');
  content.className = 'content';
  content.contentEditable = 'true';
  content.setAttribute('aria-frozen', '1');
  content.innerHTML = display(n);
  row.appendChild(bullet); row.appendChild(content);
  parentEl.appendChild(row);
  const kids = document.createElement('div');
  kids.className = 'children' + (n._open === false ? ' hide' : '');
  (n.k||[]).forEach((c,i)=>renderNode(c, kids, n, i));
  parentEl.appendChild(kids);
  bullet.onclick = () => { if(!n.k || !n.k.length) return; n._open = (n._open === false); kids.classList.toggle('hide'); bullet.textContent = n._open === false ? '▸' : '▾'; };

  content.addEventListener('focus', () => {
    content.setAttribute('aria-frozen', '0');
    content.textContent = editable(n);
  });
  content.addEventListener('blur', () => {
    n.n = toRaw(content.innerText);
    content.setAttribute('aria-frozen', '1');
    content.innerHTML = display(n);
    save();
  });
  content.addEventListener('keydown', (e) => {
    const txt = content.innerText;
    if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      n.n = toRaw(txt);
      const nn = { n:'', c:false, k:[] };
      (parent.k = parent.k || []).splice(idx+1, 0, nn);
      save(); rerender();
      setTimeout(() => focus(nn, 0), 30);
    } else if (e.key === 'Tab') {
      e.preventDefault();
      if (e.shiftKey) {
        const gp = n._parent && n._parent._parent;
        if (!gp) return;
        const [me] = parent.k.splice(idx, 1);
        gp.k.splice(parent._pidx + 1, 0, me);
        save(); rerender();
        setTimeout(() => focus(me, me.n.length), 30);
      } else {
        if (idx === 0) return;
        const [me] = parent.k.splice(idx, 1);
        const prev = parent.k[idx-1]; prev._open = true;
        (prev.k = prev.k || []).push(me);
        save(); rerender();
        setTimeout(() => focus(me, me.n.length), 30);
      }
    } else if (e.ctrlKey && e.key === 'Enter') {
      e.preventDefault();
      n.c = !n.c; row.classList.toggle('done'); save();
    } else if (e.ctrlKey && e.key === 'Backspace') {
      e.preventDefault();
      const txt2 = content.innerText || '';
      const sel = document.getSelection();
      if (!sel.rangeCount) return;
      const r0 = document.createRange(); r0.selectNodeContents(content);
      r0.setEnd(sel.getRangeAt(0).startContainer, sel.getRangeAt(0).startOffset);
      const off = r0.toString().length;
      let a, b;
      if (e.shiftKey) {
        a = off; b = off;
        while (b < txt2.length && /\s/.test(txt2[b])) b++;
        while (b < txt2.length && !/\s/.test(txt2[b])) b++;
      } else {
        a = off;
        while (a > 0 && /\s/.test(txt2[a-1])) a--;
        while (a > 0 && !/\s/.test(txt2[a-1])) a--;
        b = off;
      }
      if (a === b) return;
      function put(rw, idx, atStart){
        const w = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
        let acc = 0, tn;
        while ((tn = w.nextNode())) {
          const L = tn.data.length;
          if (acc + L >= idx) { if (atStart) rw.setStart(tn, idx - acc); else rw.setEnd(tn, idx - acc); return; }
          acc += L;
        }
        if (atStart) rw.selectNodeContents(content); 
      }
      const rw = document.createRange(); rw.setStart(content, 0);
      put(rw, a, true); put(rw, b, false);
      sel.removeAllRanges(); sel.addRange(rw);
      document.execCommand('delete');
      n.n = toRaw(content.innerText);
      save();
    } else if (e.key === 'Backspace' && txt === '') {
      e.preventDefault();
      if (parent.k.length <= 1) return;
      const prev = parent.k[idx-1] || null;
      parent.k.splice(idx, 1);
      save(); rerender();
      if (prev) setTimeout(() => focus(prev, prev.n.length), 30);
    }
  });
}

function rerender(){
  treeEl.innerHTML = '';
  (function clear(n){ delete n._i; delete n._parent; delete n._pidx; (n.k||[]).forEach(clear); })(DATA.root);
  (DATA.root.k||[]).forEach((c,i)=>renderNode(c, treeEl, DATA.root, i));
}
function focus(n, pos){
  const el = treeEl.querySelector('.row[data-id="' + nid(n) + '"] .content');
  if (!el) return;
  el.focus();
  const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
  const s = document.getSelection(); s.removeAllRanges(); s.addRange(r);
}
function save(){
  DATA.updated = new Date().toISOString();
  DATA.local = true;
  try { localStorage.setItem(STORE, JSON.stringify(DATA)); } catch(e){}
}

function exportOPML(){
  function enc1(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function enc(s){ return enc1(enc1(s)); }
  let out = '<?xml version="1.0"?>\n<opml version="2.0">\n <head><ownerEmail>pierreduffourc@gmail.com</ownerEmail></head>\n <body>\n';
  function walk(n, d){
    const pad = ' '.repeat(d+1);
    const comp = n.c ? ' _complete="true"' : '';
    out += pad + '<outline text="' + enc(n.n || '') + '"' + comp + (n.k && n.k.length ? '' : ' /') + '>\n';
    (n.k||[]).forEach(c => walk(c, d+1));
    if (n.k && n.k.length) out += pad + '</outline>\n';
  }
  walk(DATA.root, 1);
  out += ' </body>\n</opml>';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([out], {type:'text/x-opml'}));
  a.download = 'pro-export.opml'; a.click();
}
document.getElementById('dlOpml').onclick = exportOPML;
document.getElementById('expandAll').onclick = () => { (function f(n){ n._open = true; (n.k||[]).forEach(f); })(DATA.root); rerender(); };
document.getElementById('collapseAll').onclick = () => { (function f(n){ n._open = false; (n.k||[]).forEach(f); })(DATA.root); rerender(); };

function start(){ if (started) return; started = true; rerender(); }
